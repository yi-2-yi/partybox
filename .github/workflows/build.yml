name: PartyBox CI & Mobile Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test party_core
        working-directory: packages/party_core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test party_server
        working-directory: packages/party_server
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Test & Build Android APK
        working-directory: apps/party_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: partybox-android-apk
          path: apps/party_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Direct Download APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/party_app/build/app/outputs/flutter-apk/app-release.apk PartyBox-android-latest.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest PartyBox-android-latest.apk --clobber
          else
            gh release create latest PartyBox-android-latest.apk \
              --title "PartyBox 安卓最新版（直接下载安装）" \
              --notes "点击下方 **PartyBox-android-latest.apk** 即可直接下载安装（免登录、免解压）。支持狼人杀、掼蛋、一夜终极狼人及局域网/热点零安装扫码联机。"
          fi

  ios-unsigned-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build iOS (unsigned verification)
        working-directory: apps/party_app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
